# SafetyNet gateway in front of an external agent container.
#
# 1. Pull/run your agent image (NeMo Guardrails, LangGraph Server, Dify, or a CrewAI FastAPI
#    wrapper) as a service on this network.
# 2. Point SafetyNet at it via UPSTREAM_TYPE + UPSTREAM_URL.
# 3. Send traffic to SafetyNet (:8000), not to the agent directly.
#
# With no upstream configured, SafetyNet runs against a built-in stub agent so you can test the
# security pipeline (prompt injection, IP, harmful content) immediately.

services:
  safetynet:
    build: .
    image: safetynet-gateway:latest
    ports:
      - "8000:8000"
    # Lets the gateway reach an agent stack running in a *separate* compose project (e.g. Dify)
    # via http://host.docker.internal. On Docker Desktop this resolves automatically; the mapping
    # below makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POLICY_PATH: /app/policies/default.yaml
      UPSTREAM_TYPE: ${UPSTREAM_TYPE:-stub}   # stub | nemo | openai | langgraph | dify | crewai
      UPSTREAM_URL: ${UPSTREAM_URL:-}         # e.g. http://host.docker.internal  (Dify on :80)
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-gpt-3.5-turbo}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-} # Dify app key (app-...) or upstream bearer token

  # To guard Dify: run Dify's own compose (see docs/INTEGRATIONS.md), then start this gateway with
  #   UPSTREAM_TYPE=dify UPSTREAM_URL=http://host.docker.internal UPSTREAM_API_KEY=app-xxxx docker compose up --build
