# SynemaGuard default policy.
# This is the "swap ethics by config, not code" surface. Framework weights are normalized to
# sum 1.0 at load time; harm_threshold is an internal harm-model knob (NOT a decision cutoff).
version: "0.1.0"

ethics:
  stance: deontology_veto        # deontology_veto | weighted | strictest
  human_review_on_flag: false
  frameworks:
    deontology:
      enabled: true
      weight: 0.5
      duties:
        - id: no_deception_of_minors
          description: "Characters must not deceive children."
          forbidden_substrings: ["lies to a child", "lie to a child", "deceive a child", "deception of a minor"]
        - id: no_real_world_violence_instructions
          description: "No instructions enabling real-world harm."
          forbidden_substrings: ["how to build a bomb", "make a weapon", "synthesize poison"]
        - id: no_protected_ip_reproduction
          description: "Do not reproduce protected third-party IP verbatim."
          forbidden_substrings: ["captain sprocket", "glimmertown"]
    consequentialism:
      enabled: true
      weight: 0.5
      harm_threshold: 0.5         # internal modeling knob, not a BLOCK/FLAG cutoff
      baseline_harm: 0.0
      harm_terms:
        gore: 0.6
        graphic violence: 0.6
        terrifying: 0.3
        cruelty: 0.5
      benefit_terms:
        spare their feelings: 0.5
        comfort: 0.3
        educational: 0.3
        heartwarming: 0.3

scanners:                         # each: enabled + per-scanner fail_mode (BLOCK | FLAG)
  content_safety:   { enabled: true, fail_mode: BLOCK }
  copyright:        { enabled: true, fail_mode: BLOCK }
  prompt_injection: { enabled: true, fail_mode: BLOCK }
  character_bible:  { enabled: true, fail_mode: FLAG }

character_bible_ref: policies/character_bible.yaml

circuit_breaker:
  cumulative_risk_threshold: 1.5  # halt once accrued FLAG risk crosses this
