[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safetynet"
version = "0.1.0"
description = "A deterministic, rule-based ethical orchestration layer (safety net) for generative AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "krishddd" }]
keywords = ["ai-safety", "guardrails", "agents", "ethics", "langgraph", "governance"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Orchestration adapters
langgraph = ["langgraph>=0.2"]
nemo = ["nemoguardrails>=0.9"]
crewai = ["crewai>=0.40"]
# Real moderation backends for ContentSafetyScanner
guard = ["transformers>=4.40", "torch>=2.0"]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/krishddd/safety-net"
Repository = "https://github.com/krishddd/safety-net"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"safetynet.benchmark" = ["data/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines tolerated (docstrings/rationales)
