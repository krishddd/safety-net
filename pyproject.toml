[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synemaguard"
version = "0.1.0"
description = "A deterministic, rule-based ethical orchestration layer (safety net) for generative AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "krishddd" }]
keywords = ["ai-safety", "guardrails", "agents", "ethics", "langgraph", "governance"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/krishddd/safety-net"
Repository = "https://github.com/krishddd/safety-net"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines tolerated (docstrings/rationales)
