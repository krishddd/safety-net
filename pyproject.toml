[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safetynet"
version = "0.1.0"
description = "A deterministic, rule-based ethical orchestration layer (safety net) for generative AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "krishddd" }]
keywords = ["ai-safety", "guardrails", "agents", "ethics", "gateway", "governance"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Transport to external agent endpoints + the gateway service
http = ["httpx>=0.27"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# Real scanner backends (content / copyright / injection / vision moderation)
guard = ["transformers>=4.40", "torch>=2.0", "pillow>=10.0"]
embeddings = ["sentence-transformers>=2.2", "pillow>=10.0"]   # CLIP image copyright check
anthropic = ["anthropic>=0.40"]
vision-azure = ["azure-ai-contentsafety>=1.0"]
vision-aws = ["boto3>=1.34"]
# Observability
langfuse = ["langfuse>=2.0"]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.urls]
Homepage = "https://github.com/krishddd/safety-net"
Repository = "https://github.com/krishddd/safety-net"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"safetynet.benchmark" = ["data/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines tolerated (docstrings/rationales)
